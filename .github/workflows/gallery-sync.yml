name: Gallery sync (Telegram)

on:
  schedule:
    - cron: "*/10 * * * *"   # every ~10 minutes
  workflow_dispatch:          # allow manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: gallery-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Pull new photos from Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
        run: python scripts/telegram_gallery_sync.py

      - name: Commit any new photos
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "wildstar-gallery-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "gallery: sync new photos from Telegram"
            git push
          else
            echo "No changes to commit."
          fi
